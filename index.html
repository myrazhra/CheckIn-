const s=S.sel,o=occ(s),l=lvl(o);set('in',`<h2>${Z[s].n} <span class="t2">(${s})</span></h2><p class="big" style="color:${COL[l]}">${Math.round(o*100)}%</p><p>${WORD[l]} · ${cnt[s]||0} of ${Z[s].c} people</p>${s==='reg'||s==='food'?`<p>Queue: ~${Math.max(0,(cnt[s]||0)-8)} waiting</p>`:''}<p class="t2">Source: Demo simulation · updated ${new Date().toLocaleTimeString()}${S.sim.redirect?'<br>Redirection is ON':''}</p><p class="t2">Busiest zone: ${Z[busy].n} ${Math.round(occ(busy)*100)}%</p>`);
set('al',S.alerts.length?S.alerts.map(a=>`<div class="al" style="border-color:${COL[a.sev]}"><b>${WORD[a.sev]}</b> ${a.time}<br>${a.msg}<br><i>Suggested: ${a.act}</i>${S.tab==='al'?`<br><button class="btn s" onclick="S.sel='${a.z}';tab('sim')">Show on twin</button>`:''}</div>`).join(''):'<p class="t2">No alerts yet. Try a scenario in the digital twin.</p>');

let cam=null,lastC='',lastT=0;
function chk(c){if(!c)return;if(c===lastC&&Date.now()-lastT<2500)return;lastC=c;lastT=Date.now();const m=$('#sr');let x,bg,f;if(c!==PAY){x='✖ Invalid ticket (demo validation).';bg='#7f1d1d';f=180}else if(S.used){x='⚠ Ticket already checked in.';bg='#92400e';f=330}else{S.used=true;S.checkins++;x='✔ Sarah Jenkins checked in (demo validation, not production-verified).';bg='#14532d';f=880}beep(f);if(m){m.textContent=x;m.style.background=bg}else S.tm.q=x;live()}
async function camOn(){const m=$('#sr');if(cam)return;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent='Camera access is not available here. Open the page over HTTPS in its own browser tab, or use manual entry.';return}
let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){m.textContent=e.name==='NotAllowedError'?'Camera permission denied. Click the camera/lock icon next to the address bar, allow the camera, then tap Start scanning again.':'No usable camera found, or this page is not allowed to use it. Try opening it in its own browser tab, or use manual entry.';return}
cam=st;const v=$('#vid');v.srcObject=st;$('#vw').style.display='block';try{await v.play()}catch(e){}
let bd=null;try{if('BarcodeDetector' in window)bd=new BarcodeDetector({formats:['qr_code']})}catch(e){}
if(!bd&&!window.jsQR){m.textContent='The QR decoder could not load (check your internet connection), so the camera cannot read codes. Use manual entry.';return}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});m.textContent='Camera on. Hold a QR code inside the frame.';
st.t=setInterval(async()=>{if(!v.videoWidth)return;try{let val;if(bd){const r=await bd.detect(v);val=r[0]&&r[0].rawValue}else{const w=Math.min(640,v.videoWidth);cv.width=w;cv.height=Math.round(v.videoHeight*w/v.videoWidth);cx.drawImage(v,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height);val=r&&r.data}if(val)chk(val)}catch(e){}},250)}
function camOff(){if(cam){clearInterval(cam.t);cam.getTracks().forEach(x=>x.stop());cam=null}const v=$('#vid');if(v){v.srcObject=null;$('#vw').style.display='none'}}
/* ---- main loop ---- */
let lt=0;function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;if(S.sim.run)step(dt);navStep(dt);const o=$('#oc');if(o)draw(o,0);const n=$('#nc');if(n)draw(n,1);requestAnimationFrame(loop)}
warm(25);R();requestAnimationFrame(loop);setInterval(()=>{if(S.mode)live()},400);
